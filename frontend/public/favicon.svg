<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00FF88" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Cyber Plate -->
  <rect width="32" height="32" rx="7" fill="#03060D" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#00FF88" stroke-opacity="0.25" stroke-width="1" />

  <!-- Aegis Shield Outline -->
  <path d="M16 4.5L6 8.5V15C6 21.2 10.3 26.9 16 28.5C21.7 26.9 26 21.2 26 15V8.5L16 4.5Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round" 
        fill="#050C18" 
        fill-opacity="0.85"
        filter="url(#neonGlow)" />

  <!-- Inner Silicon Microarchitectural Core -->
  <rect x="12" y="11" width="8" height="8" rx="1.5" fill="url(#coreGrad)" fill-opacity="0.2" stroke="url(#coreGrad)" stroke-width="1.2" />
  
  <!-- Silicon Interconnect Crossbar Grid -->
  <path d="M16 8V11M16 19V22M9.5 15H12M20 15H22.5" stroke="#00FF88" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="16" cy="15" r="1.5" fill="#00FF88" />
</svg>