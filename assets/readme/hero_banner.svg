<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060D"/>
      <stop offset="50%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#03060D"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="nvidiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 255, 136, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1.5"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Left Side: Project Identity & Brand -->
  <!-- Top Track Pill -->
  <g transform="translate(60, 48)">
    <rect width="360" height="28" rx="6" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#00FF88" filter="url(#glowGreen)"/>
    <text x="30" y="18" font-family="'JetBrains Mono', monospace, -apple-system" font-size="11" font-weight="700" fill="#00FF88" letter-spacing="1">
      NEBIUS × NVIDIA GLOBAL AI HACKATHON '26
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="130" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    AEGIS // <tspan fill="url(#nvidiaGrad)" filter="url(#glowGreen)">KERNEL</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="172" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#94A3B8">
    Autonomous Adversarial GPU Proving Ground &amp; Invariant Synthesizer
  </text>

  <text x="60" y="202" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748B">
    NVIDIA Nemotron 3 Ultra · Nebius Ephemeral Cloud Sandboxes · Tavily Architecture Oracle
  </text>

  <!-- Feature Pills Strip -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: 2.35x -->
    <rect x="0" y="0" width="165" height="42" rx="8" fill="rgba(0, 255, 136, 0.08)" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00FF88">2.35x SPEEDUP</text>
    <text x="110" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">vLLM</text>

    <!-- Pill 2: 100% Invariant -->
    <rect x="180" y="0" width="220" height="42" rx="8" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
    <text x="194" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#00F0FF">100% FORMAL PASS</text>
    <text x="350" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">0 SDC</text>

    <!-- Pill 3: Hardware Targets -->
    <rect x="415" y="0" width="230" height="42" rx="8" fill="rgba(255, 184, 0, 0.08)" stroke="rgba(255, 184, 0, 0.25)" stroke-width="1"/>
    <text x="429" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FFB800">HOPPER H100 · B200</text>
    <text x="590" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">SM90</text>
  </g>

  <!-- Right Side: Cyber Core Reactor Diagram -->
  <g transform="translate(940, 180)">
    <!-- Outer dashed energy ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(0, 255, 136, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(255, 0, 85, 0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Central Hex Reactor Box -->
    <rect x="-38" y="-38" width="76" height="76" rx="16" fill="#040812" stroke="#00FF88" stroke-width="2" filter="url(#glowGreen)"/>
    
    <!-- Shield / Bolt Icon inside Core -->
    <path d="M 0 -22 L 20 -8 L 20 12 C 20 24 0 32 0 32 C 0 32 -20 24 -20 12 L -20 -8 Z" fill="rgba(0, 255, 136, 0.15)" stroke="#00FF88" stroke-width="2"/>
    <path d="M 2 -12 L -8 2 L 0 2 L -2 14 L 8 0 L 0 0 Z" fill="#00F0FF" filter="url(#glowCyan)"/>

    <!-- Orbital Orbit Nodes -->
    <!-- Red Node (Top Left) -->
    <circle cx="-74" cy="-55" r="7" fill="#FF0055" filter="url(#glowCoral)"/>
    <text x="-125" y="-72" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF0055">RED FUZZER</text>

    <!-- Blue Node (Bottom Right) -->
    <circle cx="74" cy="55" r="7" fill="#00FF88" filter="url(#glowGreen)"/>
    <text x="88" y="60" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">BLUE HEALER</text>

    <!-- Cyan Node (Top Right) -->
    <circle cx="78" cy="-45" r="5" fill="#00F0FF" filter="url(#glowCyan)"/>
    <text x="90" y="-42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF">NEBIUS BOX</text>
  </g>
</svg>
